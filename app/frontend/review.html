<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review flagged tracks</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0;
           min-height: 100vh; padding: 20px; }
    .wrap { max-width: 1040px; margin: 0 auto; }
    h1 { font-size: 22px; color: #fff; font-weight: 600; }
    .sub { font-size: 13px; color: #777; margin: 4px 0 16px; }
    a { color: #1db954; }
    .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .progress { flex: 1 1 220px; min-width: 200px; }
    .progress .track { height: 8px; background: #1c1c26; border-radius: 4px; overflow: hidden; }
    .progress .fill { height: 100%; background: #1db954; width: 0; transition: width .25s; }
    .progress .label { font-size: 12px; color: #888; margin-top: 4px; }
    select, button { font: inherit; }
    select { background: #14141c; color: #e0e0e0; border: 1px solid #2a2a38; border-radius: 6px; padding: 8px 10px; }
    .card { background: #12121a; border: 1px solid #22222e; border-radius: 12px; padding: 18px; }
    .head { display: flex; gap: 14px; margin-bottom: 14px; align-items: flex-start; }
    .cover { width: 84px; height: 84px; border-radius: 8px; background: #1c1c26; object-fit: cover; flex: none; }
    .headtext { flex: 1; min-width: 0; }
    .title { font-size: 20px; color: #fff; font-weight: 600; }
    .artist { color: #aaa; margin-top: 2px; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: #1c1c26; color: #bbb; white-space: nowrap; }
    .chip.wrong { background: #3a1820; color: #ff8a9b; }
    .chip.grey { background: #3a2f12; color: #ffd166; }
    .chip.version { background: #1b2c3d; color: #7cc4ff; }
    .chip.stem { background: #2c1a3d; color: #d6a8ff; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }
    .panel { background: #0e0e15; border: 2px solid #22222e; border-radius: 10px; padding: 12px; transition: border-color .15s; min-width: 0; }
    .panel.active { border-color: #1db954; }
    .panel h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
    .panel .name { font-size: 13px; color: #ccc; word-break: break-all; margin-bottom: 8px; min-height: 2.6em; }
    .panel .missing { color: #ff8a9b; font-size: 13px; }
    audio { width: 100%; height: 40px; }
    .status { font-size: 12px; color: #888; margin-top: 6px; min-height: 1.4em; }
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab { background: #1c1c26; border: 1px solid #2a2a38; color: #bbb; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    .tab.on { background: #26263a; color: #fff; border-color: #4a4a68; }
    .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
    .video iframe, .video > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .ytinfo { font-size: 13px; margin: 8px 0 4px; color: #ddd; }
    .ytinfo .ch { color: #888; }
    .ytrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .note { font-size: 12px; color: #ffd166; margin-top: 6px; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
    .btn { background: #1c1c26; color: #e0e0e0; border: 1px solid #2a2a38; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
    .btn:hover { background: #242433; }
    .btn.small { padding: 5px 10px; font-size: 12px; }
    .btn.primary { background: #1db954; border-color: #1db954; color: #04130a; font-weight: 600; }
    .btn.primary:hover { background: #1ed760; }
    .btn kbd { font: 11px ui-monospace, Consolas, monospace; background: #0a0a0f; border: 1px solid #333; border-radius: 4px;
               padding: 1px 5px; margin-left: 6px; color: #999; }
    .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .mark { padding: 18px 10px; text-align: center; line-height: 1.3; font-size: 16px; font-weight: 600; }
    .mark.on { outline: 2px solid #fff; }
    .mark.right { background: #123a24; border-color: #1db954; }
    .mark.wrong { background: #3a1820; border-color: #ff5a73; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 8px; flex-wrap: wrap; }
    .hint { font-size: 12px; color: #666; margin-top: 12px; line-height: 1.6; }
    .empty { text-align: center; padding: 60px 20px; color: #888; }
    .list { margin-top: 18px; border-top: 1px solid #1c1c26; padding-top: 12px; max-height: 260px; overflow: auto; }
    .row { display: flex; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; align-items: center; }
    .row:hover { background: #16161f; }
    .row.cur { background: #1b1b27; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #333; flex: none; }
    .dot.right { background: #1db954; } .dot.wrong { background: #ff5a73; }
    .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .s { color: #777; font-variant-numeric: tabular-nums; }
    .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 14px; }
    @media (max-width: 800px) { .notes { grid-template-columns: 1fr; } }
    .notes label { font-size: 12px; color: #999; display: block; }
    .notes label span { color: #666; }
    .notes input { width: 100%; margin-top: 4px; background: #0e0e15; color: #e8e8e8; border: 1px solid #2a2a38; border-radius: 8px;
                   padding: 9px 10px; font: inherit; }
    .notes input:focus { outline: none; border-color: #1db954; }
    .preview { grid-column: 1 / -1; font-size: 13px; color: #8a8a99; min-height: 1.3em; }
    .preview b { color: #ffd166; font-weight: 600; }
    .row .tag { font-size: 11px; color: #ffd166; margin-left: 6px; }
    .notes input.suggested { color: #ffd166; font-style: italic; border-style: dashed; }
    .keep { margin: 0 0 14px; padding: 10px 12px; border: 1px dashed #2a2a38; border-radius: 10px; }
    .keep > label { font-size: 13px; color: #bbb; cursor: pointer; display: flex; gap: 8px; align-items: center; }
    .keepfields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    @media (max-width: 800px) { .keepfields { grid-template-columns: 1fr; } }
    .keepfields label { font-size: 12px; color: #999; }
    .keepfields input { width: 100%; margin-top: 4px; background: #0e0e15; color: #e8e8e8; border: 1px solid #2a2a38;
                        border-radius: 8px; padding: 9px 10px; font: inherit; }
    .keepfields input.suggested { color: #ffd166; font-style: italic; border-style: dashed; }
    .keepfields input:focus { outline: none; border-color: #1db954; }
    .keepfields .preview { grid-column: 1 / -1; }
    .keepfields[hidden] { display: none; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1f1f2c; border: 1px solid #3a3a4e;
             border-radius: 10px; padding: 10px 14px; display: none; gap: 14px; align-items: center; box-shadow: 0 8px 30px #000a;
             font-size: 14px; z-index: 10; max-width: 92vw; }
    .toast.show { display: flex; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Review flagged tracks</h1>
    <div class="sub">The reference on the right is the real track and is always correct. Listen to the new file and say whether it
        matches. Nothing here changes your library — your marks are saved and used afterwards. <a href="/">Back to File Fetcher</a></div>

    <div class="bar">
        <div class="progress">
            <div class="track"><div class="fill" id="fill"></div></div>
            <div class="label" id="progressLabel"></div>
        </div>
        <button class="btn" id="applyBtn" title="Write version labels and renamed songs into Rekordbox (Rekordbox must be closed)">Apply to Rekordbox</button>
        <select id="filter" aria-label="Which tracks to show">
            <option value="unmarked">Unmarked only</option>
            <option value="all">All flagged</option>
            <option value="right">Marked right</option>
            <option value="wrong">Marked wrong</option>
            <option value="wrong_clear">Clearly different song</option>
            <option value="grey">Grey zone (could be a remix)</option>
            <option value="version">Probably a different version</option>
            <option value="stem">Vocals-only / no bass</option>
        </select>
    </div>

    <div id="stage"></div>
    <div class="list" id="list"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span>
    <button class="btn" id="undoBtn">Undo <kbd>U</kbd></button></div>

<script src="https://www.youtube.com/iframe_api" async></script>
<script>
const MARKS = [
    ['right', '✓ New file is right', '1'],
    ['wrong', '✗ New file is wrong', '2'],
];
let data = { items: [], marked: 0, total: 0 };
let view = [];           // the items the current filter shows
let pos = 0;             // index into view
let active = 'new';      // which source is "live" for the keyboard: 'new' or the chosen reference
let refTab = 'yt';       // the reference shown on the right: 'yt' | 'old' | 'sp'
try { refTab = localStorage.getItem('reviewRefTab') || 'yt'; } catch (e) {}
let ytApiReady = false, ytPlayer = null, ytResults = [], ytIndex = 0, ytReady = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => isFinite(s) && s != null ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '–';
window.onYouTubeIframeAPIReady = () => { ytApiReady = true; if (refTab === 'yt' && view[pos]) mountYouTube(); };

async function load(keepId) {
    data = await (await fetch('/api/review/items')).json();
    applyFilter(keepId);
}

function applyFilter(keepId) {
    const f = $('filter').value;
    view = data.items.filter(it => f === 'all' ? true : f === 'unmarked' ? !it.mark
                                  : (f === 'right' || f === 'wrong') ? it.mark === f : it.group === f);
    // most uncertain first: the grey zone, then the clearly different, then the rest
    const order = { grey: 0, wrong_clear: 1, stem: 2, version: 3, other: 4 };
    view.sort((a, b) => (order[a.group] - order[b.group]) || ((a.similarity ?? 9) - (b.similarity ?? 9)));
    pos = keepId ? Math.max(0, view.findIndex(i => i.id === keepId)) : Math.min(pos, Math.max(0, view.length - 1));
    render();
}

function groupChip(it) {
    const sim = it.similarity == null ? '' : ' · match ' + it.similarity.toFixed(2);
    const label = { wrong_clear: 'Clearly different song', grey: 'Grey zone', version: 'Probably another version',
                    stem: 'Vocals-only / no bass', other: 'Flagged' }[it.group];
    const cls = { wrong_clear: 'wrong', grey: 'grey', version: 'version', stem: 'stem' }[it.group] || '';
    return `<span class="chip ${cls}">${label}${sim}</span>`;
}

function render() {
    destroyYouTube();
    const done = data.marked, total = data.total;
    $('fill').style.width = total ? (100 * done / total) + '%' : '0';
    $('progressLabel').textContent = `${done} of ${total} marked`;
    renderList();
    updatePending();
    const stage = $('stage');
    if (!view.length) {
        stage.innerHTML = `<div class="card empty">${data.total ? 'Nothing left in this view. 🎉' : 'No flagged tracks found. Run the audit first.'}</div>`;
        return;
    }
    const it = view[pos];
    active = 'new';
    stage.innerHTML = `
    <div class="card">
        <div class="head">
            <img class="cover" src="/api/review/cover/${it.id}" alt="Cover art" onerror="this.style.visibility='hidden'">
            <div class="headtext">
                <div class="title">${esc(it.title)}</div>
                <div class="artist">${esc(it.artist)} · ${esc(it.playlist)}</div>
                <div class="meta">${groupChip(it)}${it.bass_share ? `<span class="chip">bass ${esc(it.bass_share)}</span>` : ''}</div>
            </div>
        </div>
        <div class="panels">
            <div class="panel active" id="panel-new">
                <h2>New file · is this the right track?</h2>
                <div class="name">${it.has_new ? esc(it.new_name) : '<span class="missing">File not found</span>'}</div>
                ${it.has_new ? `<audio id="audio-new" controls preload="none" src="/api/review/audio/${it.id}/new"></audio>` : ''}
                <div class="status" id="status-new"></div>
            </div>
            <div class="panel" id="panel-ref">
                <h2>Reference · the real track (always right)</h2>
                <div class="tabs">
                    <button class="tab ${refTab === 'yt' ? 'on' : ''}" data-tab="yt">YouTube video</button>
                    <button class="tab ${refTab === 'sp' ? 'on' : ''}" data-tab="sp">Spotify</button>
                    <button class="tab ${refTab === 'old' ? 'on' : ''}" data-tab="old">Old MP3</button>
                </div>
                <div id="ref-body"></div>
            </div>
        </div>
        <div class="tools">
            <button class="btn primary" id="switchBtn" title="Swap to the other version at the same position">Switch A/B <kbd>Tab</kbd></button>
            <button class="btn" id="playBtn">Play / pause <kbd>Space</kbd></button>
            <span style="color:#666;font-size:12px">Jump to</span>
            ${[30, 60, 120].map(s => `<button class="btn" data-jump="${s}">${fmt(s)}</button>`).join('')}
            <button class="btn" data-jump="-10" title="Back 10 seconds">−10s <kbd>[</kbd></button>
            <button class="btn" data-jump="+10" title="Forward 10 seconds">+10s <kbd>]</kbd></button>
        </div>
        <div class="notes">
            <label>Version label <span>— a different mix of this song that you are keeping? <b>Tab</b> accepts the suggestion, <b>L</b> jumps here</span>
                <input id="labelInput" maxlength="80" placeholder="e.g. CZR's Peak Hour Mix" autocomplete="off"></label>
            <label>Private note <span>(only kept here)</span>
                <input id="noteInput" maxlength="300" placeholder="anything you want to remember" autocomplete="off" value="${esc(it.note)}"></label>
            <div class="preview" id="labelPreview"></div>
        </div>
        <div class="keep">
            <label><input type="checkbox" id="keepBox"> It is a <b>completely different song</b> that I want to keep <span style="color:#666">(<b>O</b>)</span></label>
            <div class="keepfields" id="keepFields" hidden>
                <label>Artist <input id="keepArtist" maxlength="120" autocomplete="off"></label>
                <label>Title <input id="keepTitle" maxlength="160" autocomplete="off"></label>
                <div class="preview" id="keepPreview"></div>
            </div>
        </div>
        <div class="marks">
            ${MARKS.map(([key, text, k]) => `<button class="btn mark ${key} ${it.mark === key ? 'on' : ''}" data-mark="${key}">${text}<kbd>${k}</kbd></button>`).join('')}
        </div>
        <div class="nav">
            <button class="btn" id="prevBtn">← Previous</button>
            <span style="color:#777;font-size:13px">${pos + 1} of ${view.length} in this view</span>
            <span>
                ${it.mark ? '<button class="btn" id="clearBtn">Clear mark</button>' : ''}
                <button class="btn" id="nextBtn">Skip / next →</button>
            </span>
        </div>
        <div class="hint">Shortcuts: <b>Space</b> play/pause · <b>Tab</b> switch version (keeps your place) · <b>1</b> right · <b>2</b> wrong · <b>U</b> undo ·
            <b>← →</b> previous/next · <b>[ ]</b> seek. The first play of an AIFF takes a few seconds while it is prepared for the browser.
            Spotify's player can't be synced to a position, so use it to confirm which song it is.</div>
    </div>`;
    wire(it);
    showRef(it);
}

// ---------------------------------------------------------------- the reference panel
function showRef(it) {
    destroyYouTube();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === refTab));
    const body = $('ref-body');
    if (refTab === 'sp') {
        body.innerHTML = it.spotify_id
            ? `<iframe style="border-radius:10px;width:100%;height:152px;border:0" src="https://open.spotify.com/embed/track/${esc(it.spotify_id)}"
                       allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
               <div class="status">Spotify's own copy of this track (the one in your playlist). A short preview unless you are signed in to Spotify in this browser.</div>`
            : '<div class="missing">No Spotify id recorded for this track.</div>';
        return;
    }
    if (refTab === 'old') {
        body.innerHTML = `<div class="name">${it.has_old ? esc(it.old_name) : '<span class="missing">No older MP3 found</span>'}</div>
            ${it.has_old ? `<audio id="audio-old" controls preload="none" src="/api/review/audio/${it.id}/old"></audio>` : ''}
            <div class="status" id="status-old"></div>
            <div class="note">This MP3 came from sff's automatic YouTube search, so it can be wrong too.</div>`;
        const p = $('audio-old');
        if (p) hookAudio(p, 'old');
        return;
    }
    body.innerHTML = `<div class="video"><div id="yt-holder"></div></div>
        <div class="ytinfo" id="yt-info">Searching YouTube…</div>
        <div class="ytrow" id="yt-row"></div>`;
    loadYoutube(it);
}

async function loadYoutube(it) {
    const id = it.id;
    try {
        const r = await fetch('/api/review/youtube/' + id);
        if (!r.ok) throw new Error((await r.json()).detail || r.status);
        const d = await r.json();
        if (view[pos]?.id !== id) return;                  // moved on while searching
        ytResults = d.results; ytIndex = 0;
        if (!ytResults.length) { $('yt-info').textContent = 'YouTube found nothing for “' + d.query + '”.'; return; }
        mountYouTube();
    } catch (e) {
        if ($('yt-info')) $('yt-info').innerHTML = `<span class="missing">Could not reach YouTube (${esc(e.message)}).</span>`;
    }
}

function mountYouTube() {
    if (!ytResults.length || !$('yt-holder')) return;
    const v = ytResults[ytIndex];
    $('yt-info').innerHTML = `<b>${esc(v.title)}</b> <span class="ch">· ${esc(v.channel)} · ${fmt(v.duration)}</span>`;
    $('yt-row').innerHTML = `
        <button class="btn small" id="ytNext">Next result (${ytIndex + 1}/${ytResults.length})</button>
        <a class="btn small" href="${esc(v.url)}" target="_blank" rel="noopener" style="text-decoration:none">Open on YouTube ↗</a>
        <span class="status" id="status-yt"></span>`;
    $('ytNext').onclick = () => { destroyYouTube(); ytIndex = (ytIndex + 1) % ytResults.length; mountYouTube(); };
    if (!ytApiReady) { $('status-yt').textContent = 'Loading the YouTube player…'; return; }
    const holder = $('yt-holder');
    ytReady = false;
    ytPlayer = new YT.Player(holder, {
        videoId: v.id, host: 'https://www.youtube-nocookie.com',
        playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
            onReady: () => { ytReady = true; },
            onStateChange: e => { if (e.data === 1) setActive('yt'); },
            onError: () => { const s = $('status-yt'); if (s) s.innerHTML = '<span class="missing">The uploader blocks embedding — use “Open on YouTube”, or try the next result.</span>'; },
        },
    });
}

function destroyYouTube() {
    try { if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch (e) {}
    ytPlayer = null; ytReady = false;
    const h = document.getElementById('ref-body');
    if (h && refTab === 'yt' && !document.getElementById('yt-holder')) { /* rebuilt by showRef */ }
}

// ---------------------------------------------------------------- one interface over the players
function ctl(which) {
    if (which === 'new' || which === 'old') {
        const a = $('audio-' + which);
        if (!a) return null;
        return {
            time: () => a.currentTime, playing: () => !a.paused, pause: () => a.pause(),
            seek: t => new Promise(res => { const go = () => { a.currentTime = t; res(); };
                                            a.readyState >= 1 ? go() : (a.preload = 'auto', a.addEventListener('loadedmetadata', go, { once: true }), a.load()); }),
            play: () => a.play(),
        };
    }
    if (which === 'yt' && ytPlayer && ytReady) {
        return { time: () => ytPlayer.getCurrentTime(), playing: () => ytPlayer.getPlayerState() === 1, pause: () => ytPlayer.pauseVideo(),
                 seek: t => { ytPlayer.seekTo(t, true); return Promise.resolve(); }, play: () => ytPlayer.playVideo() };
    }
    return null;
}

function refKey() { return refTab; }          // 'yt' | 'old' | 'sp'
function other() { return active === 'new' ? refKey() : 'new'; }

function setActive(which) {
    active = which;
    $('panel-new')?.classList.toggle('active', which === 'new');
    $('panel-ref')?.classList.toggle('active', which !== 'new');
}

async function switchAB() {
    const target = other();
    const from = ctl(active), to = ctl(target);
    if (!to) { toast(target === 'sp' ? "Spotify's player can't be synced — press play in it yourself." : 'That player is not ready yet.'); return; }
    const t = from ? from.time() : 0, wasPlaying = from && from.playing();
    if (from) from.pause();
    setActive(target);
    await to.seek(t);
    if (wasPlaying) to.play();
}

function togglePlay() {
    const cur = ctl(active);
    if (!cur) return;
    for (const w of ['new', 'old', 'yt']) { if (w !== active) ctl(w)?.pause(); }
    cur.playing() ? cur.pause() : cur.play();
}

async function jump(spec) {
    const cur = ctl(active);
    if (!cur) return;
    const rel = spec[0] === '+' || spec[0] === '-';
    await cur.seek(rel ? Math.max(0, cur.time() + Number(spec)) : Number(spec));
}

function hookAudio(p, w) {
    p.addEventListener('play', () => { setActive(w); for (const o of ['new', 'old']) if (o !== w) ctl(o)?.pause(); ctl('yt')?.pause(); });
    p.addEventListener('waiting', () => { const s = $('status-' + w); if (s) s.textContent = 'Preparing…'; });
    p.addEventListener('playing', () => { const s = $('status-' + w); if (s) s.textContent = ''; });
    p.addEventListener('loadedmetadata', () => { const s = $('status-' + w); if (s) s.textContent = 'Length ' + fmt(p.duration); });
    p.addEventListener('error', () => { const s = $('status-' + w); if (s) s.textContent = 'Could not play this file'; });
}

function wire(it) {
    const n = $('audio-new');
    if (n) hookAudio(n, 'new');
    $('switchBtn').onclick = switchAB;
    $('playBtn').onclick = togglePlay;
    document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => jump(b.dataset.jump));
    document.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => mark(it, b.dataset.mark));
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
        stopAll();
        refTab = b.dataset.tab;
        try { localStorage.setItem('reviewRefTab', refTab); } catch (e) {}
        setActive('new');
        showRef(it);
    });
    wireNotes(it);
    $('prevBtn').onclick = () => go(-1);
    $('nextBtn').onclick = () => go(1);
    if ($('clearBtn')) $('clearBtn').onclick = () => mark(it, null);
}

let noteTimer = null;

function labeledTitle(it, label) {
    const clean = label.replace(/[\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
    return clean ? `${it.title} [${clean}]` : it.title;
}

// A box can start with a SUGGESTION (dim, italic, dashed). It is only kept if you accept it:
// Tab or Enter in the box, or typing. Leaving it alone saves nothing.
function suggestible(input, suggestion, saved, onAccept) {
    const state = { pending: !saved && !!suggestion };
    input.value = saved || suggestion || '';
    input.classList.toggle('suggested', state.pending);
    const accept = () => { if (state.pending) { state.pending = false; input.classList.remove('suggested'); onAccept(); } };
    input.addEventListener('keydown', e => {
        if (e.key === 'Tab' || e.key === 'Enter') accept();
        else if (e.key === 'Escape' && state.pending) { input.value = ''; state.pending = false; input.classList.remove('suggested'); onAccept(); }
    });
    input.addEventListener('input', () => { state.pending = false; input.classList.remove('suggested'); onAccept(); });
    state.value = () => (state.pending ? '' : input.value.trim());
    return state;
}

function wireNotes(it) {
    const save = async () => {
        it.label = lab.value();
        it.note = $('noteInput').value.trim();
        const keep = $('keepBox').checked;
        it.keep_artist = keep ? art.value() : '';
        it.keep_title = keep ? ttl.value() : '';
        await fetch('/api/review/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: it.id, label: it.label, note: it.note, keep_artist: it.keep_artist, keep_title: it.keep_title }) });
        if (it.keep_title) it.mark = 'wrong';
        updatePending();
    };
    const later = (ms = 600) => { clearTimeout(noteTimer); noteTimer = setTimeout(save, ms); };

    const preview = () => {
        const label = lab.value();
        $('labelPreview').innerHTML = $('keepBox').checked ? ''
            : label ? `Rekordbox will show: <b>${esc(labeledTitle(it, label))}</b>` + (it.applied_label === label ? ' (already applied)' : '')
            : (lab.pending ? `Suggested from the file name: <b>${esc(labeledTitle(it, $('labelInput').value))}</b> — press Tab to use it.`
                           : (it.applied_label ? 'Label removed — the plain title is put back when you apply.' : ''));
        const a = art.value(), t = ttl.value();
        $('keepPreview').innerHTML = $('keepBox').checked
            ? `Rekordbox will show: <b>${esc(a ? a + ' — ' : '')}${esc(t || '…')}</b>. The Spotify track “${esc(it.title)}” will be fetched again on the next sync.` : '';
    };

    const lab = suggestible($('labelInput'), it.suggested_label, it.label, () => { preview(); later(); });
    $('noteInput').addEventListener('input', () => later());
    $('noteInput').addEventListener('blur', () => later(0));

    const art = suggestible($('keepArtist'), it.suggested_artist, it.keep_artist, () => { preview(); later(); });
    const ttl = suggestible($('keepTitle'), it.suggested_title, it.keep_title, () => { preview(); later(); });
    const box = $('keepBox');
    box.checked = !!it.keep_title;
    $('keepFields').hidden = !box.checked;
    box.onchange = () => {
        $('keepFields').hidden = !box.checked;
        if (box.checked) { art.pending = ttl.pending = false; $('keepArtist').classList.remove('suggested'); $('keepTitle').classList.remove('suggested'); }
        preview(); later(0);
        if (box.checked) $('keepTitle').focus();
    };
    lab.pending = lab.pending;
    preview();
}

function pendingLabels() {
    return data.items.filter(i => i.keep_title ? !i.applied_keep : (i.mark !== 'wrong' && (i.label || '') !== (i.applied_label || ''))).length;
}

function updatePending() {
    const n = pendingLabels();
    $('applyBtn').textContent = n ? `Apply to Rekordbox (${n})` : 'Apply to Rekordbox';
    $('applyBtn').disabled = n === 0;
}

async function applyLabels() {
    if (!confirm('Write the version labels and renamed songs into Rekordbox (and the files)? Rekordbox must be closed.')) return;
    $('applyBtn').disabled = true;
    const r = await fetch('/api/review/apply-labels', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) { toast(d.detail || 'Could not apply the changes.'); updatePending(); return; }
    toast(`Applied to ${d.applied.length} track(s)` + (d.failed.length ? ` — ${d.failed.length} not found in Rekordbox: ${d.failed.join(', ')}` : '.'));
    await load(view[pos]?.id);
}

function go(d) {
    if (!view.length) return;
    stopAll();
    pos = (pos + d + view.length) % view.length;
    render();
}

function stopAll() { for (const w of ['new', 'old', 'yt']) { try { ctl(w)?.pause(); } catch (e) {} } }

let lastMark = null, toastTimer = null;

async function setMark(id, value) {
    await fetch('/api/review/mark', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ id, mark: value }) });
}

function toast(text, withUndo = false) {
    $('toastText').textContent = text;
    $('undoBtn').style.display = withUndo ? '' : 'none';
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 10000);
}

async function mark(it, value) {
    stopAll();
    lastMark = { id: it.id, prev: it.mark };
    await setMark(it.id, value);
    if (value) toast(`Marked “${it.title}”: ${MARKS.find(m => m[0] === value)[1]}`, true);
    const wasUnmarkedView = $('filter').value === 'unmarked';
    const nextId = view[(pos + 1) % view.length]?.id;
    await load(wasUnmarkedView && value ? nextId : it.id);
}

async function undo() {
    if (!lastMark) return;
    const { id, prev } = lastMark;
    lastMark = null;
    $('toast').classList.remove('show');
    stopAll();
    await setMark(id, prev || null);
    if ($('filter').value === 'unmarked') $('filter').value = 'all';
    await load(id);
}

function renderList() {
    $('list').innerHTML = view.map((it, i) => `<div class="row ${i === pos ? 'cur' : ''}" data-i="${i}">
        <span class="dot ${it.mark || ''}"></span>
        <span class="t">${esc(it.title)} <span style="color:#666">— ${esc(it.artist)}</span>${it.label ? `<span class="tag">[${esc(it.label)}]</span>` : ''}</span>
        <span class="s">${it.similarity == null ? '' : it.similarity.toFixed(2)}</span></div>`).join('');
    document.querySelectorAll('.row').forEach(r => r.onclick = () => { stopAll(); pos = Number(r.dataset.i); render(); });
}

document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    const it = view[pos];
    if (!it) return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'Tab') { e.preventDefault(); switchAB(); }
    else if (e.key === '1' || e.key === '2') { mark(it, MARKS[Number(e.key) - 1][0]); }
    else if (e.key === 'u' || e.key === 'U') undo();
    else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); $('labelInput').focus(); $('labelInput').select(); }
    else if (e.key === 'o' || e.key === 'O') { e.preventDefault(); const b = $('keepBox'); b.checked = true; b.onchange(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === '[') jump('-10');
    else if (e.key === ']') jump('+10');
});

$('filter').onchange = () => { stopAll(); pos = 0; applyFilter(); };
$('undoBtn').onclick = undo;
$('applyBtn').onclick = applyLabels;
load();
</script>
</body>
</html>
